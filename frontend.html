<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Hotel Frontend UI</title>
        <style>
            body{
                font-family: Arial, Helvetica, sans-serif;
                padding: 20px;
                background-color: #f4f4f9;
            }
            h2{color: #333;}
            .form-box{
                background: white;
                padding: 20px;
                border-radius: 8px;
                box-shadow: 0 2px 8px rgba(0,0,0,0.1);
                margin-bottom: 30px;
                max-width: 500px;
            }
            .form-box input, .form-box select {
                width: 100%;
                padding: 10px;
                margin: 8px 0 15px 0;
                border: 1px solid #ccc;
                border-radius: 5px;
                box-sizing: border-box;
            }
            .form-box button{
                background-color: #28a745;
                color: white;
                padding: 12px;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                font-weight: bold;
                width: 100%;
            }
            .form-box button:hover{background-color: #218838;}
            table{
                width: 100%;
                border-collapse: collapse;
                background: white;
                margin-top: 20PX;
            }
            th,td{
                border: 1px solid #ccc;
                padding: 12px;
                text-align: left;
            }
            th{background-color: #007bff;color: white;}
        </style>
    </head>
    <body>
        <h2>Book your stay</h2>
        <div class="form-box">
            <form id="bookingForm">
                <lable>Customer Name: </lable>
                <input type="text" id="fullname" required>

                <lable>Phone Number: </lable>
                <input type="text" id="phone" required>

                <lable>Room Type: </lable>
                <select id="room_type">
                    <option value="Standard">Standard</option>
                    <option value="Deluxe">Deluxe</option>
                    <option value="Suite">Suite</option>
                </select>

                <button type="submit">Book Room</button>
            </form>
        </div>
        <h2>Shabari Hotel - Live Bookings</h2>
        <table>
            <thead>
                <tr>
                    <th>Booking ID</th>
                    <th>Customer Name</th>
                    <th>Phone Number</th>
                    <th>Room Type</th>
                </tr>
            </thead>
            <tbody id="data-container">
                <tr colspan="4">Loading data...</tr>
            </tbody>
        </table>

        <script>
            async function loadBookings(){
                try{
                    let response = await fetch('api_bookings.php');
                    let data = await response.json();

                    let tableBody = document.getElementById('data-container');
                    tableBody.innerHTML = "";

                    if(data.length > 0){
                        data.forEach(booking => {
                            let row = `<tr>
                                <td>${booking.id}</td>
                                <td>${booking.fullname}</td>
                                <td>${booking.phone}</td>
                                <td>${booking.room_type}</td>
                            </tr>`;
                            tableBody.innerHTML += row;
                        });
                    }else{
                        tableBody.innerHTML = "<tr><td colspan='4'>Innum Bookings Varala jii.</td></tr>";
                    }
                }catch(error){
                    console.error("API Error:", error);
                    document.getElementById('data-container').innerHTML = "<tr><td colspan='4' style='color:red;'>Data edukkum pothu error!</td></tr>";
                };
            }
            loadBookings();

            document.getElementById('bookingForm').addEventListener('submit',async function(e){
                e.preventDefault();

                let bookingData = {
                    fullname: document.getElementById('fullname').value,
                    phone: document.getElementById('phone').value,
                    room_type: document.getElementById('room_type').value
                };

                try{
                    let response = await fetch('api_add_booking.php',{
                        method: 'POST',
                        headers:{
                            'Content-Type':'application/json'
                        },
                        body: JSON.stringify(bookingData)
                    });
                    let result = await response.json();

                    alert(result.message);
                    if(result.status === 'success'){
                        document.getElementById('bookingForm').reset();
                        loadBookings();
                    }
                }catch(error){
                    console.error("Submit Error:", error);
                }
            })
        </script>
    </body>
</html>
